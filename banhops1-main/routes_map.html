<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #2a9d8f;
            --accent-hover: #264653;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            
            /* Governorate Colors */
            --color-internal: #e76f51;
            --color-cairo: #457b9d;
            --color-giza: #9b5de5;
            --color-monufia: #f15bb5;
            --color-dakahlia: #00bbf9;
            --color-alex: #00f5d4;
            --color-kafrelsheikh: #fee440;
            --color-upper: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2a9d8f, #e76f51);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Search Bar styling */
        .search-container {
            max-width: 600px;
            margin: 0 auto 3rem auto;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 3rem 1.2rem 1.5rem;
            border-radius: 50px;
            border: 2px solid var(--border);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            box-shadow: var(--card-shadow);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(42, 157, 143, 0.4);
        }

        .search-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.3rem;
            pointer-events: none;
        }

        /* Main Grid and Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Governorate Selector List */
        .governorates-sidebar {
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            height: fit-content;
            box-shadow: var(--card-shadow);
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .gov-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 1rem;
            background: none;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-secondary);
            text-align: right;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.8rem;
        }

        .gov-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .gov-btn.active {
            background-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
        }

        .gov-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 0.8rem;
        }

        /* Results Display Panel */
        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .route-count {
            background-color: var(--bg-secondary);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* Routes Card Grid */
        .routes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .route-card {
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .route-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 100%;
            background-color: var(--gov-color, var(--accent));
        }

        .route-card:hover {
            transform: translateY(-5px);
            border-color: var(--gov-color, var(--accent));
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card-category {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gov-color, var(--accent));
            margin-bottom: 0.8rem;
        }

        .card-route {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.8rem;
        }

        .fare-badge {
            background-color: rgba(42, 157, 143, 0.15);
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .line-badge {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            background-color: var(--bg-secondary);
            border-radius: 20px;
            border: 1px dashed var(--border);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        // Mapping categories to high-level groupings/governorates
        const govConfig = {
            "all": { name: "جميع الخطوط", color: "var(--accent)" },
            "cairo": { name: "محافظة القاهرة", color: "var(--color-cairo)", categories: ["القليوبية والقاهرة"] },
            "giza": { name: "محافظة الجيزة", color: "var(--color-giza)", categories: ["القليوبية والجيزة"] },
            "monufia": { name: "محافظة المنوفية", color: "var(--color-monufia)", categories: ["القليوبية والمنوفية"] },
            "dakahlia": { name: "محافظة الدقهلية", color: "var(--color-dakahlia)", categories: ["القليوبية والدقهلية"] },
            "alex": { name: "محافظة الإسكندرية", color: "var(--color-alex)", categories: ["القليوبية والإسكندرية"] },
            "kafrelsheikh": { name: "محافظة كفر الشيخ", color: "var(--color-kafrelsheikh)", categories: ["القليوبية وكفر الشيخ"] },
            "upper": { name: "الوجه القبلي والصعيد", color: "var(--color-upper)", categories: ["القليوبية والوجه القبلي"] },
            "internal": { name: "القليوبية (الخطوط الداخلية)", color: "var(--color-internal)", categories: [
                "شبين القناطر", "طوخ", "قليوب", "بنها", "حي غرب شبرا الخيمة", "كفر شكر", "الخانكة", "قها", "حي شرق شبرا الخيمة", "القناطر الخيرية"
            ]}
        };

        let activeGovKey = "all";

        function getGovKeyFromCategory(category) {
            for (const key in govConfig) {
                if (govConfig[key].categories && govConfig[key].categories.includes(category)) {
                    return key;
                }
            }
            return "all";
        }

        // Initialize UI
        function init() {
            renderSidebar();
            renderRoutes();
            
            // Search Input listener
            document.getElementById('searchInput').addEventListener('input', () => {
                renderRoutes();
            });
        }

        // Render Sidebar filters
        function renderSidebar() {
            const govList = document.getElementById('govList');
            govList.innerHTML = '';

            for (const key in govConfig) {
                const gov = govConfig[key];
                const btn = document.createElement('button');
                btn.className = `gov-btn ${key === activeGovKey ? 'active' : ''}`;
                btn.id = `gov-btn-${key}`;
                btn.onclick = () => selectGov(key);
                
                const dot = document.createElement('span');
                dot.className = 'gov-dot';
                dot.style.backgroundColor = gov.color;

                const name = document.createElement('span');
                name.textContent = gov.name;

                btn.appendChild(dot);
                btn.appendChild(name);
                govList.appendChild(btn);
            }
        }

        function selectGov(key) {
            activeGovKey = key;
            // Update active states
            document.querySelectorAll('.gov-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`gov-btn-${key}`).classList.add('active');
            
            // Update panel header
            document.getElementById('activeGovName').textContent = govConfig[key].name;
            
            // Render filtered routes
            renderRoutes();
        }

        // Filter and Render Route Cards
        function renderRoutes() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('routesGrid');
            grid.innerHTML = '';

            let allMatchedLines = [];

            rawData.forEach(catGroup => {
                const govKey = getGovKeyFromCategory(catGroup.category);
                
                // Filter by Gov Category Sidebar
                if (activeGovKey !== 'all' && activeGovKey !== govKey) {
                    return;
                }

                catGroup.lines.forEach(line => {
                    const matchesSearch = 
                        line.route.toLowerCase().includes(searchQuery) ||
                        catGroup.category.toLowerCase().includes(searchQuery) ||
                        line.fare.toString().includes(searchQuery);

                    if (searchQuery === '' || matchesSearch) {
                        allMatchedLines.push({
                            category: catGroup.category,
                            govKey: govKey,
                            ...line
                        });
                    }
                });
            });

            // Update Count
            document.getElementById('routeCount').textContent = `${allMatchedLines.length} خط`;

            // Handle Empty State
            if (allMatchedLines.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>لا توجد نتائج تطابق بحثك حالياً.</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem; color: var(--text-secondary);">تأكد من كتابة الكلمات بشكل صحيح أو تجربة كلمة بحث أخرى.</p>
                    </div>
                `;
                return;
            }

            // Render cards
            allMatchedLines.forEach(line => {
                const card = document.createElement('div');
                card.className = 'route-card';
                card.style.setProperty('--gov-color', govConfig[line.govKey].color);

                card.innerHTML = `
                    <div>
                        <div class="card-category">${line.category}</div>
                        <div class="card-route">${line.route}</div>
                    </div>
                    <div class="card-footer">
                        <span class="line-badge">خط رقم ${line.line_no}</span>
                        <span class="fare-badge">${line.fare.toFixed(2)} ج.م</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Run application
        init();
    </script>
